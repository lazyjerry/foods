<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>吃過筆記｜分享的點評</title>
<meta name="description" content="朋友分享的食物點評">
<meta name="robots" content="noindex">
<script>if (typeof HTMLDialogElement === "function") document.documentElement.classList.add("has-dialog");</script>
<link rel="stylesheet" href="jerry-ui.css">
<link rel="stylesheet" href="app.css">
<script src="jerry-ui.js" defer></script>
<script type="module" src="js/shared.js"></script>
</head>
<body>
<a class="skip-link" href="#main">跳到主要內容</a>
<div class="wrap is-wide">
<header class="top">
  <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">食</span>吃過筆記</a>
  <div class="top-end"><p class="pill">SHARED · READ ONLY</p><button hidden class="btn is-sm" type="button" id="share-open">分享</button></div>
</header>
<header class="masthead">
  <p class="eyebrow">SHARED FOOD NOTES</p>
  <div class="masthead-grid">
    <h1><span>吃過筆記</span><em>分享</em></h1>
    <p class="lede">朋友吃過、覺得值得一提的店，整理在這裡。</p>
  </div>
</header>
<main id="main">
<div class="stack"><div class="card-grid"><section class="card accent-coral is-roomy is-wide" aria-labelledby="shared-title"><div class="card-heading">
  <span class="index-badge" aria-hidden="true">01</span>
  <div><h2 id="shared-title">分享的點評</h2><p>載入中…</p></div>
</div>
<p class="status" id="shared-status" role="status"></p>
<div class="app-review-list" id="shared-list"></div>
<dialog class="app-lightbox" id="photo-box" aria-label="照片大圖">
  <div class="app-lightbox-body">
    <div class="app-lightbox-head"><span class="app-slider-count" id="photo-box-count"></span><button class="sheet-x" type="button" id="photo-box-close" aria-label="關閉">×</button></div>
    <img class="app-lightbox-img" id="photo-box-img" alt="">
    <p class="app-lightbox-caption" id="photo-box-caption"></p>
    <div class="app-slider-bar" id="photo-box-bar"><button class="btn secondary" type="button" data-box="-1">‹ 上一張</button><button class="btn secondary" type="button" data-box="1">下一張 ›</button></div>
  </div>
</dialog>
<dialog class="sheet" id="share-card" aria-labelledby="share-card-title">
  <div class="sheet-body" tabindex="-1" autofocus>
    <div class="sheet-head">
      <div><h2 id="share-card-title">分享連結</h2></div>
      <button class="sheet-x" type="button" data-dialog-close aria-label="關閉">×</button>
    </div>
    <div class="stack"><div class="field">
  <label for="share-card-url">網址（不用登入就能看）</label>
  <input readonly id="share-card-url" type="text">
</div>
<div class="actions"><button class="btn" type="button" id="share-card-copy">複製網址</button><button hidden class="btn secondary" type="button" id="share-card-link">用其他 App 分享網址</button></div>
<div class="app-card-preview" id="share-card-preview" aria-live="polite"></div>
<div class="actions"><a hidden id="share-card-save" download class="btn" href="#">儲存圖片</a><button hidden class="btn secondary" type="button" id="share-card-image">分享圖片</button></div>
<p class="status" id="share-card-status" role="status"></p></div>
    <p class="sheet-foot"><button class="btn" type="button" data-dialog-close>關閉</button></p>
  </div>
</dialog></section></div></div>
</main>
<footer class="site-foot is-mono">吃過筆記 · 吃過的店，記一筆就不會忘 · © 2026 <a href="https://github.com/lazyjerry/foods" target="_blank" rel="noopener">lazyjerry</a></footer>
</div>
<img class="jerry-mark" src="jerry.png" width="1" height="1" alt="" aria-hidden="true">
</body>
</html>
