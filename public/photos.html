<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>照片集｜瀏覽、搜尋與下載壓縮後的點評照片</title>
<meta name="description" content="瀏覽、搜尋與下載點評照片">
<meta name="robots" content="noindex">
<script>if (typeof HTMLDialogElement === "function") document.documentElement.classList.add("has-dialog");</script>
<link rel="stylesheet" href="jerry-ui.css">
<link rel="stylesheet" href="app.css">
<script src="jerry-ui.js" defer></script>
<script type="module" src="js/photos.js"></script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f5f3ed">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="吃過筆記">
<script type="module" src="js/pwa.js"></script>
</head>
<body>
<a class="skip-link" href="#main">跳到主要內容</a>
<div class="wrap is-wide">
<header class="top">
  <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">食</span>吃過筆記</a>
  <div class="top-end"><button class="btn is-sm secondary" type="button" id="logout-btn">登出</button></div>
</header>
<header class="masthead">
  <p class="eyebrow">PHOTO GALLERY</p>
  <div class="masthead-grid">
    <h1><span>照片集</span><em>瀏覽下載</em></h1>
    <p class="lede">翻翻吃過的每一餐，想要的照片存回手機。</p>
  </div>
</header>
<main id="main">
<div class="stack"><nav class="chips" aria-label="頁面">
  <a class="chip" href="/">點評</a>
  <a class="chip" href="/edit">新增</a>
  <a class="chip" href="/photos" aria-current="page">照片集</a>
  <a class="chip" href="/share">分享</a>
  <a class="chip" href="/settings">設定</a>
</nav>
<div class="card-grid"><section class="card accent-green is-roomy is-wide" aria-labelledby="gallery-title"><div class="card-heading">
  <span class="index-badge" aria-hidden="true">01</span>
  <div><h2 id="gallery-title">照片集</h2><p>依店名、地址、點評、分類或照片說明搜尋</p></div>
</div>
<form class="panel" id="search-form"><div class="field">
  <label for="q">關鍵字</label>
  <div class="input-group">
  <input id="q" type="text" placeholder="例如：拉麵 信義" autocomplete="off" spellcheck="false">
  <button type="submit" id="search-btn" aria-label="搜尋照片">搜尋</button>
</div>
  <p class="hint">以空白分隔多個關鍵字，全部符合才列出</p>
</div></form>
<p class="status" id="gallery-status" role="status"></p>
<div class="app-gallery" id="gallery"></div>
<button hidden class="btn secondary" type="button" id="more-btn">載入更多</button></section></div>
<aside class="note">
  <span class="note-icon" aria-hidden="true">⌁</span>
  <div><strong>照片在你的裝置上壓縮後才上傳</strong><p>原始照片不會離開裝置，上傳的是壓縮後的 JPEG，拍攝位置等 EXIF 資料一併移除。地址查詢經由 OpenStreetMap Nominatim。</p></div>
</aside></div>
</main>
<footer class="site-foot is-mono">吃過筆記 · 吃過的店，記一筆就不會忘 · © 2026 <a href="https://github.com/lazyjerry/foods" target="_blank" rel="noopener">lazyjerry</a></footer>
</div>
<img class="jerry-mark" src="jerry.png" width="1" height="1" alt="" aria-hidden="true">
</body>
</html>
